[build]
  command = "npm run build"
  publish = "dist"

# Ensures client-side routes like /product/premium-cotton-shirt-cs102
# don't 404 on a hard refresh or direct link — Netlify serves index.html
# and React Router takes over from there.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
